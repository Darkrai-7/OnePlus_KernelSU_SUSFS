name: Build and Release OnePlus 15 Kernel

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      make_release:
        description: 'Do you want to create a release?'
        required: true
        type: boolean
        default: false

      # ------------------------------------------------------------
      # OP15 ONLY
      # ------------------------------------------------------------
      # Deliberately no OP6T / OP15R / OP14 / OP13 / etc.
      # The matrix filter below ALSO performs an exact model match.
      # ------------------------------------------------------------
      op_model:
        description: 'OnePlus device to build'
        required: true
        type: choice
        options:
          - OP15
        default: OP15

      ksu_options:
        description: 'Enter KernelSU build json'
        required: true
        type: string
        default: '[{"type":"ksun","hash":"dev"}]'

      optimize_level:
        description: "Compiler optimization level"
        required: true
        type: choice
        options:
          - O2
          - O3
        default: O2

      clean_build:
        description: 'Clean build (no ccache)'
        type: boolean
        default: false

      debug:
        description: 'Enable debug mode: dumping debug related artifacts and show some debug logs'
        required: false
        type: boolean
        default: false

      mirror_toolchains:
        description: 'Do you want to sync toolchains before build? [99% runs not required]'
        required: false
        type: boolean
        default: false

      build_timestamp:
        description: 'Custom kernel build timestamp for uname -a (e.g. "Tue Feb 10 10:01:02 UTC 2026"). Leave empty for current time.'
        type: string
        default: ''

      android12-5_10_susfs_branch_or_commit:
        description: 'Enter SusFS Branch or commit hash for android12-5.10'
        type: string
        default: ''

      android13-5_15_susfs_branch_or_commit:
        description: 'Enter SusFS Branch or commit hash for android13-5.15'
        type: string
        default: ''

      android14-6_1_susfs_branch_or_commit:
        description: 'Enter SusFS Branch or commit hash for android14-6.1'
        type: string
        default: ''

      android15-6_6_susfs_branch_or_commit:
        description: 'Enter SusFS Branch or commit hash for android15-6.6'
        type: string
        default: ''

      android16-6_12_susfs_branch_or_commit:
        description: 'Enter SusFS Branch or commit hash for android16-6.12'
        type: string
        default: ''


# ==================================================================
# SET OP15 MODEL
# ==================================================================

jobs:

  set-op-model:
    runs-on: ubuntu-latest

    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      device_count: ${{ steps.set-matrix.outputs.count }}

      active_gki_keys: ${{ steps.set-matrix.outputs.active_gki_keys }}

      susfs_hash_android12_5_10: ${{ steps.set-matrix.outputs.susfs_hash_android12_5_10 }}
      susfs_hash_android13_5_15: ${{ steps.set-matrix.outputs.susfs_hash_android13_5_15 }}
      susfs_hash_android14_6_1: ${{ steps.set-matrix.outputs.susfs_hash_android14_6_1 }}
      susfs_hash_android15_6_6: ${{ steps.set-matrix.outputs.susfs_hash_android15_6_6 }}
      susfs_hash_android16_6_12: ${{ steps.set-matrix.outputs.susfs_hash_android16_6_12 }}

      ksu_resolved_hash: ${{ steps.set-matrix.outputs.ksu_resolved_hash }}
      ksu_options_normalized: ${{ steps.set-matrix.outputs.ksu_options_normalized }}

      susfs_base_version: ${{ steps.set-matrix.outputs.susfs_base_version }}

    env:
      GH_TOKEN: ${{ github.token }}
      GH_HTTP_TIMEOUT: 600

    steps:

      # ------------------------------------------------------------
      # Checkout configs only
      # ------------------------------------------------------------

      - name: 📥 Checkout Code (to access configs/)
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            configs/
          sparse-checkout-cone-mode: false


      # ------------------------------------------------------------
      # Generate OP15-only build matrix
      # ------------------------------------------------------------

      - name: 🔍 Generate OP15-only build matrix
        id: set-matrix
        shell: bash
        run: |
          set -euo pipefail

          echo "::group::Matrix generation"

          input="${{ github.event.inputs.op_model }}"
          ksu_options_raw='${{ github.event.inputs.ksu_options }}'

          # --------------------------------------------------------
          # HARD SECURITY / SAFETY CHECK
          # --------------------------------------------------------

          if [ "$input" != "OP15" ]; then
            echo "::error::This workflow only supports OP15."
            echo "::error::Received: $input"
            exit 1
          fi

          echo "🎯 Target device: OP15"
          echo "🚫 OP15R / OP6T / OP13 / OP14 / other devices are disabled."

          # --------------------------------------------------------
          # Normalize KSU configuration
          # --------------------------------------------------------

          if ! ksu_options_normalized=$(echo "$ksu_options_raw" | jq -c '
            map(
              if .type
              then
                .type |= ascii_upcase |
                if .hash == null
                then
                  if .type == "KSUN"
                  then .hash = "dev"
                  elif .type == "KSU"
                  then .hash = "main"
                  else .hash
                  end
                else .
                end
              else
                error("No type found")
              end
            )
          ' 2>&1); then
            echo "::error::ksu_options validation failed: $ksu_options_normalized"
            exit 1
          fi

          echo "ksu_options_normalized=$ksu_options_normalized" >> "$GITHUB_OUTPUT"

          # --------------------------------------------------------
          # Read all configs
          # --------------------------------------------------------

          echo "[" > matrix.json

          mapfile -t all_json_files < <(
            find configs/ -name "*.json" -print0 | xargs -0 -n1
          )

          for i in "${!all_json_files[@]}"; do

            file="${all_json_files[$i]}"

            if [ -f "$file" ]; then

              jq -r '.' "$file" >> matrix.json

              if [ $((i+1)) -lt ${#all_json_files[@]} ]; then
                echo "," >> matrix.json
              fi

            fi

          done

          echo "]" >> matrix.json


          # --------------------------------------------------------
          # OP15 EXACT MATCH
          # --------------------------------------------------------

          jq_filter='map(select(.model == "OP15"))'

          filtered=$(jq -c "$jq_filter" matrix.json)

          count=$(jq 'length' <<< "$filtered")


          # --------------------------------------------------------
          # Fail if OP15 does not exist
          # --------------------------------------------------------

          if [ "$count" -eq 0 ]; then

            echo "::error::No exact OP15 configuration was found in configs/."

            echo ""
            echo "Available models found in configs/:"

            jq -r '
              .[]
              | .model
            ' matrix.json | sort -u | sed 's/^/  - /'

            echo ""
            echo "Expected an exact model name:"
            echo "  OP15"

            exit 1
          fi


          # --------------------------------------------------------
          # Sort OP15 configurations
          # --------------------------------------------------------

          filtered=$(echo "$filtered" | jq '
            sort_by(
              (.os_version | gsub("A"; "") | tonumber? // 0) * -1,
              .model
            )
          ')

          echo "$filtered" | jq '.' > matrix.json


          # --------------------------------------------------------
          # Combine each OP15 config with each KSU configuration
          # --------------------------------------------------------

          merged_matrix=$(
            jq -n \
              --argjson devices "$filtered" \
              --argjson ksu_list "$ksu_options_normalized" \
              '[
                $devices[] as $dev
                |
                $ksu_list[] as $ksu
                |
                (
                  $dev
                  + {
                      ksu_type: $ksu.type,
                      ksu_hash: $ksu.hash
                    }
                )
              ]'
          )

          final_count=$(echo "$merged_matrix" | jq 'length')

          echo "✅ Found $final_count OP15 build(s)"

          echo ""
          echo "Selected devices:"

          jq -r '
            .[]
            |
            "  - \(.model) (\(.os_version), \(.android_version)-\(.kernel_version), \(.ksu_type) - \(.ksu_hash))"
          ' <<< "$merged_matrix"

          echo "count=$count" >> "$GITHUB_OUTPUT"


          # --------------------------------------------------------
          # Resolve KernelSU
          # --------------------------------------------------------

          ksu_type=$(echo "$ksu_options_normalized" | jq -r '.[0].type')
          ksu_ref=$(echo "$ksu_options_normalized" | jq -r '.[0].hash')

          if [ "$ksu_type" == "KSUN" ]; then

            KSU_REPO_OWNER="KernelSU-Next"
            KSU_REPO_NAME="KernelSU-Next"

          else

            KSU_REPO_OWNER="tiann"
            KSU_REPO_NAME="KernelSU"

          fi

          HEAD_REF="refs/heads/${ksu_ref}"
          TAG_REF="refs/tags/${ksu_ref}"

          QUERY='
          query(
            $owner: String!,
            $name: String!,
            $headRef: String!,
            $tagRef: String!,
            $objRef: String!
          ) {

            repository(owner: $owner, name: $name) {

              hb: ref(qualifiedName: $headRef) {
                t: target {
                  ... on Commit {
                    o: oid
                  }
                }
              }

              ht: ref(qualifiedName: $tagRef) {
                t: target {
                  ... on Commit {
                    o: oid
                  }
                }
              }

              ho: object(expression: $objRef) {
                ... on Commit {
                  o: oid
                }
              }

            }

          }'

          MAX_RETRIES=3
          RETRY_COUNT=0
          RETRY_DELAY=5

          echo "Resolving $ksu_type hash ($ksu_ref)..."

          until [ $RETRY_COUNT -ge $MAX_RETRIES ]; do

            RESULT=$(
              gh api graphql \
                -f query="$QUERY" \
                -f owner="$KSU_REPO_OWNER" \
                -f name="$KSU_REPO_NAME" \
                -f headRef="$HEAD_REF" \
                -f tagRef="$TAG_REF" \
                -f objRef="$ksu_ref" \
                2>/dev/null
            )

            EXIT_CODE=$?

            if [ $EXIT_CODE -eq 0 ] && [ -n "$RESULT" ]; then

              echo "  ✅ API Success"
              break

            fi

            RETRY_COUNT=$((RETRY_COUNT + 1))

            echo "::warning::API failed (Attempt $RETRY_COUNT/$MAX_RETRIES). Retrying in ${RETRY_DELAY}s..."

            sleep "$RETRY_DELAY"

          done

          if [ $RETRY_COUNT -eq $MAX_RETRIES ]; then

            echo "::error::GitHub API unreachable. Cannot validate $ksu_ref"
            exit 1

          fi

          resolved_sha=$(
            echo "$RESULT"
            |
            jq -r '
              .data.repository
              |
              (.hb.t.o // .ht.t.o // .ho.o // "unknown")
            '
          )

          if [ "$resolved_sha" == "unknown" ]; then

            echo "::error::Ref/Hash '$ksu_ref' does not exist in $KSU_REPO_OWNER/$KSU_REPO_NAME"
            exit 1

          fi

          echo "  ✅ Resolved: $ksu_type/$ksu_ref → $resolved_sha"

          echo "ksu_resolved_hash=$resolved_sha" >> "$GITHUB_OUTPUT"


          # --------------------------------------------------------
          # Inject resolved KSU hash
          # --------------------------------------------------------

          merged_matrix=$(
            echo "$merged_matrix"
            |
            jq \
              --arg resolved_sha "$resolved_sha" \
              'map(.ksu_resolved_hash = $resolved_sha)'
          )


          # --------------------------------------------------------
          # SUSFS
          # --------------------------------------------------------

          SUSFS_REPO="https://gitlab.com/simonpunk/susfs4ksu.git"
          GITLAB_PROJECT_PATH="simonpunk/susfs4ksu"

          declare -A default_branches=(

            ["android12-5.10"]="gki-android12-5.10"

            ["android13-5.15"]="gki-android13-5.15"

            ["android14-6.1"]="gki-android14-6.1"

            ["android15-6.6"]="gki-android15-6.6"

            ["android16-6.12"]="gki-android16-6.12"

          )

          declare -A user_inputs=(

            ["android12-5.10"]="${{ inputs.android12-5_10_susfs_branch_or_commit }}"

            ["android13-5.15"]="${{ inputs.android13-5_15_susfs_branch_or_commit }}"

            ["android14-6.1"]="${{ inputs.android14-6_1_susfs_branch_or_commit }}"

            ["android15-6.6"]="${{ inputs.android15-6_6_susfs_branch_or_commit }}"

            ["android16-6.12"]="${{ inputs.android16-6_12_susfs_branch_or_commit }}"

          )


          # --------------------------------------------------------
          # Active GKI versions
          # --------------------------------------------------------

          mapfile -t active_keys < <(

            echo "$merged_matrix"

            |

            jq -r '
              .[]
              |
              select(.susfs == true)
              |
              "\(.android_version)-\(.kernel_version)"
            '

            |

            sort -u

          )

          echo "🔍 Resolving SUSFS hashes for: ${active_keys[*]:-none}"

          declare -A susfs_hashes
          declare -A susfs_versions_per_key

          for key in "${active_keys[@]}"; do

            default_val="${default_branches[$key]}"
            user_val="${user_inputs[$key]:-$default_val}"

            HASH_QUERY="
            {
              project(fullPath: \"${GITLAB_PROJECT_PATH}\") {
                repository {
                  ch: commit(ref: \"${user_val}\") {
                    sha
                  }
                }
              }
            }"

            RELEASE_QUERY="
            {
              project(fullPath: \"${GITLAB_PROJECT_PATH}\") {
                repository {
                  ch: commit(ref: \"${user_val}\") {
                    sha
                  }

                  blobs(
                    paths: [\"kernel_patches/include/linux/susfs.h\"],
                    ref: \"${user_val}\"
                  ) {
                    nodes {
                      rawBlob
                    }
                  }
                }
              }
            }"

            if [ "${{ inputs.make_release }}" = "true" ]; then
              GL_QUERY="$RELEASE_QUERY"
            else
              GL_QUERY="$HASH_QUERY"
            fi

            MAX_RETRIES=3
            RETRY_COUNT=0
            RETRY_DELAY=5

            resolved=""

            until [ $RETRY_COUNT -ge $MAX_RETRIES ]; do

              RESPONSE=$(
                curl -s \
                  --fail \
                  -G \
                  "https://gitlab.com/api/graphql" \
                  --data-urlencode "query=$GL_QUERY"
              )

              EXIT_CODE=$?

              if [ $EXIT_CODE -eq 0 ] && [ -n "$RESPONSE" ]; then

                resolved=$(
                  echo "$RESPONSE"
                  |
                  jq -r '
                    .data.project.repository.ch.sha
                    // empty
                  '
                )

                if [ -n "$resolved" ] && [ "$resolved" != "null" ]; then

                  echo "  ✅ Query for $key Success"

                  if [ "${{ inputs.make_release }}" = "true" ]; then

                    extracted=$(
                      echo "$RESPONSE"
                      |
                      jq -r '
                        .data.project.repository.blobs.nodes[0].rawBlob
                        // empty
                      '
                      |
                      grep '#define SUSFS_VERSION'
                      |
                      awk -F'"' '{print $2}'
                    )

                    susfs_versions_per_key[$key]="${extracted:-unknown}"

                    echo "  ✅ $key → SUSFS_VERSION = ${extracted:-unknown}"

                  fi

                  break

                fi

              fi

              RETRY_COUNT=$((RETRY_COUNT + 1))

              echo "::warning::GitLab GraphQL API failed (Attempt $RETRY_COUNT/$MAX_RETRIES). Retrying..."

              sleep "$RETRY_DELAY"

            done

            if [ -z "$resolved" ] || [ "$resolved" = "null" ]; then

              echo "::error::Could not resolve SUSFS ref '$user_val' for $key on GitLab."

              exit 1

            fi

            if [
              "${{ inputs.make_release }}" = "true"
            ] && [
              "${susfs_versions_per_key[$key]:-unknown}" = "unknown"
            ]; then

              echo "::error::Could not extract SUSFS_VERSION from susfs.h for '$key'."

              exit 1

            fi

            susfs_hashes["$key"]="$resolved"

            echo "  ✅ Resolved: $key → $resolved"

          done


          # --------------------------------------------------------
          # Active GKI output
          # --------------------------------------------------------

          active_gki_keys_csv=$(IFS=','; echo "${active_keys[*]:-}")

          echo "active_gki_keys=$active_gki_keys_csv" >> "$GITHUB_OUTPUT"

          echo "susfs_hash_android12_5_10=${susfs_hashes[android12-5.10]:-unknown}" >> "$GITHUB_OUTPUT"

          echo "susfs_hash_android13_5_15=${susfs_hashes[android13-5.15]:-unknown}" >> "$GITHUB_OUTPUT"

          echo "susfs_hash_android14_6_1=${susfs_hashes[android14-6.1]:-unknown}" >> "$GITHUB_OUTPUT"

          echo "susfs_hash_android15_6_6=${susfs_hashes[android15-6.6]:-unknown}" >> "$GITHUB_OUTPUT"

          echo "susfs_hash_android16_6_12=${susfs_hashes[android16-6.12]:-unknown}" >> "$GITHUB_OUTPUT"


          # --------------------------------------------------------
          # SUSFS release version
          # --------------------------------------------------------

          if [ "${{ inputs.make_release }}" = "true" ]; then

            susfs_base_version="unknown"

            for key in "${active_keys[@]}"; do

              ver="${susfs_versions_per_key[$key]:-unknown}"

              if [ "$ver" != "unknown" ]; then

                susfs_base_version="$ver"

                break

              fi

            done

            if [ "$susfs_base_version" = "unknown" ]; then

              echo "::error::Could not extract SUSFS_VERSION."

              exit 1

            fi

            for key in "${active_keys[@]}"; do

              key_ver="${susfs_versions_per_key[$key]:-unknown}"

              if [ "$key_ver" != "$susfs_base_version" ]; then

                echo "::error::SUSFS version mismatch: '$key' has '$key_ver', expected '$susfs_base_version'."

                exit 1

              fi

            done

            echo "susfs_base_version=$susfs_base_version" >> "$GITHUB_OUTPUT"

          fi


          # --------------------------------------------------------
          # Inject SUSFS resolved hash
          # --------------------------------------------------------

          susfs_hashes_json=$(
            jq -n \
              --arg a12 "${susfs_hashes[android12-5.10]:-unknown}" \
              --arg a13 "${susfs_hashes[android13-5.15]:-unknown}" \
              --arg a14 "${susfs_hashes[android14-6.1]:-unknown}" \
              --arg a15 "${susfs_hashes[android15-6.6]:-unknown}" \
              --arg a16 "${susfs_hashes[android16-6.12]:-unknown}" \
              '{
                "android12-5.10": $a12,
                "android13-5.15": $a13,
                "android14-6.1": $a14,
                "android15-6.6": $a15,
                "android16-6.12": $a16
              }'
          )

          merged_matrix=$(
            echo "$merged_matrix"
            |
            jq \
              --argjson hashes "$susfs_hashes_json" \
              '[
                .[]
                |
                . + {
                  susfs_resolved_hash:
                    ($hashes["\(.android_version)-\(.kernel_version)"] // "unknown")
                }
              ]'
          )

          merged_matrix=$(
            echo "$merged_matrix"
            |
            jq '
              sort_by(
                (.os_version | gsub("A"; "") | tonumber? // 0) * -1,
                .model
              )
            '
          )


          # --------------------------------------------------------
          # FINAL HARD OP15 VALIDATION
          # --------------------------------------------------------

          non_op15_count=$(
            echo "$merged_matrix"
            |
            jq '[.[] | select(.model != "OP15")] | length'
          )

          if [ "$non_op15_count" -ne 0 ]; then

            echo "::error::SECURITY CHECK FAILED: matrix contains non-OP15 devices."

            echo "$merged_matrix" | jq -r '.[].model'

            exit 1

          fi


          # --------------------------------------------------------
          # Write matrix output
          # --------------------------------------------------------

          wrapped=$(
            jq -n \
              --argjson items "$merged_matrix" \
              '{ include: $items }'
          )

          echo "matrix=$(jq -c . <<< "$wrapped")" >> "$GITHUB_OUTPUT"

          echo ""
          echo "=================================================="
          echo "FINAL BUILD MATRIX"
          echo "=================================================="

          echo "$merged_matrix" | jq -r '
            .[]
            |
            "MODEL=\(.model) OS=\(.os_version) KERNEL=\(.android_version)-\(.kernel_version)"
          '

          echo "=================================================="

          echo "::endgroup::"


      # ------------------------------------------------------------
      # Upload build matrix
      # ------------------------------------------------------------

      - name: Upload build matrix
        uses: actions/upload-artifact@v7
        with:
          name: build-matrix
          path: matrix.json
          archive: false
          retention-days: 7


      # ------------------------------------------------------------
      # Summary
      # ------------------------------------------------------------

      - name: 📊 Build plan summary
        run: |
          ksu_type="${{ fromJSON(steps.set-matrix.outputs.ksu_options_normalized)[0].type }}"
          ksu_ref="${{ fromJSON(steps.set-matrix.outputs.ksu_options_normalized)[0].hash }}"

          ksu_display=""

          if [[ "$ksu_ref" =~ ^[0-9a-f]{40}$ ]]; then

            ksu_display+="📌 \`$ksu_type\`, \`$ksu_ref\`"

          else

            ksu_display+="🔀 \`$ksu_type\`, \`$ksu_ref\` (\`${{ steps.set-matrix.outputs.ksu_resolved_hash }}\`)"

          fi

          build_ts_input="${{ inputs.build_timestamp }}"

          if [ -z "$build_ts_input" ]; then

            build_ts_display="⏱️ auto (current build time)"

          else

            build_ts_display="📌 \`$build_ts_input\`"

          fi

          {
            cat << EOF

          ## 🎯 Build Plan

          **Target:** OP15

          **Devices:** ${{ steps.set-matrix.outputs.count }}

          **Other OnePlus models:** 🚫 Disabled

          **Configuration:**

          EOF

            echo "- KSU Config: $ksu_display"

            echo "- Build Timestamp: $build_ts_display"

            cat << EOF

          - Optimization: ${{ inputs.optimize_level }}
          - Clean Build/No Ccache: ${{ inputs.clean_build && '✅ Yes' || '❌ No' }}
          - Create Release: ${{ inputs.make_release && '✅ Yes' || '❌ No' }}
          - Create Debug Artifacts: ${{ inputs.debug && '✅ Yes' || '❌ No' }}
          - Sync toolchains: ${{ inputs.mirror_toolchains && '✅ Yes' || '❌ No' }}

          **Cache Releases:**

          - ccache-cache: enabled
          - lto-cache: enabled
          - Cache releases: pre-release / not latest

          **SUSFS Configuration:**

          EOF

          } >> "$GITHUB_STEP_SUMMARY"

          declare -A susfs_inputs=(

            ["android12-5.10"]="${{ inputs.android12-5_10_susfs_branch_or_commit }}"

            ["android13-5.15"]="${{ inputs.android13-5_15_susfs_branch_or_commit }}"

            ["android14-6.1"]="${{ inputs.android14-6_1_susfs_branch_or_commit }}"

            ["android15-6.6"]="${{ inputs.android15-6_6_susfs_branch_or_commit }}"

            ["android16-6.12"]="${{ inputs.android16-6_12_susfs_branch_or_commit }}"

          )

          declare -A step_hashes=(

            ["android12-5.10"]="${{ steps.set-matrix.outputs.susfs_hash_android12_5_10 }}"

            ["android13-5.15"]="${{ steps.set-matrix.outputs.susfs_hash_android13_5_15 }}"

            ["android14-6.1"]="${{ steps.set-matrix.outputs.susfs_hash_android14_6_1 }}"

            ["android15-6.6"]="${{ steps.set-matrix.outputs.susfs_hash_android15_6_6 }}"

            ["android16-6.12"]="${{ steps.set-matrix.outputs.susfs_hash_android16_6_12 }}"

          )

          IFS=',' read -ra active_keys_display \
            <<< "${{ steps.set-matrix.outputs.active_gki_keys }}"

          for key in "${active_keys_display[@]}"; do

            [ -z "$key" ] && continue

            value="${susfs_inputs[$key]:-}"
            fetched_hash="${step_hashes[$key]:-unknown}"

            if [ -z "$value" ]; then

              echo "- $key: 🔄 auto (\`$fetched_hash\`)" \
                >> "$GITHUB_STEP_SUMMARY"

            elif [[ "$value" =~ ^[0-9a-f]{40}$ ]]; then

              echo "- $key: 📌 \`$value\`" \
                >> "$GITHUB_STEP_SUMMARY"

            else

              echo "- $key: 🔀 \`$value\` (\`$fetched_hash\`)" \
                >> "$GITHUB_STEP_SUMMARY"

            fi

          done

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "> **Target restriction:** This workflow builds OP15 only." \
            >> "$GITHUB_STEP_SUMMARY"


# ==================================================================
# OPTIONAL TOOLCHAIN MIRROR
# ==================================================================

  mirror_toolchain:
    needs: set-op-model

    if: ${{ inputs.mirror_toolchains }}

    uses: ./.github/workflows/mirror-toolchains.yml

    secrets: inherit


# ==================================================================
# CREATE CACHE RELEASES
# ==================================================================

  prepare_cache_releases:

    name: Prepare ccache/LTO cache releases

    needs: set-op-model

    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}

    steps:

      - name: 🔧 Ensure cache releases exist
        shell: bash
        run: |
          set -euo pipefail

          echo "::group::Preparing cache releases"

          ensure_release() {

            local tag="$1"
            local title="$2"

            echo ""
            echo "Checking release: $tag"

            if gh release view "$tag" \
              --repo "$REPO" \
              >/dev/null 2>&1; then

              echo "✅ Release already exists: $tag"

              gh release edit "$tag" \
                --repo "$REPO" \
                --prerelease \
                --latest=false \
                >/dev/null 2>&1 || true

              return 0
            fi

            echo "Creating release: $tag"

            if gh release create "$tag" \
              --repo "$REPO" \
              --title "$title" \
              --notes "Internal persistent build cache. This release is not a production kernel release." \
              --prerelease \
              --latest=false; then

              echo "✅ Created cache release: $tag"

            else

              echo "Creation failed. Checking whether another workflow created it..."

              sleep 3

              if gh release view "$tag" \
                --repo "$REPO" \
                >/dev/null 2>&1; then

                echo "✅ Release now exists: $tag"

              else

                echo "::error::Could not create cache release: $tag"
                exit 1

              fi

            fi

          }

          ensure_release \
            "ccache-cache" \
            "Persistent ccache cache"

          ensure_release \
            "lto-cache" \
            "Persistent LTO cache"

          echo ""
          echo "=================================================="
          echo "CACHE RELEASES READY"
          echo "=================================================="

          gh release view ccache-cache \
            --repo "$REPO" \
            --json tagName,isPrerelease,isLatest \
            --jq '"ccache-cache: tag=\(.tagName), prerelease=\(.isPrerelease), latest=\(.isLatest)"'

          gh release view lto-cache \
            --repo "$REPO" \
            --json tagName,isPrerelease,isLatest \
            --jq '"lto-cache: tag=\(.tagName), prerelease=\(.isPrerelease), latest=\(.isLatest)"'

          echo "=================================================="

          {
            echo "## 💾 Persistent Cache Releases"
            echo ""
            echo "- \`ccache-cache\`: ✅ ready"
            echo "- \`lto-cache\`: ✅ ready"
            echo ""
            echo "Both cache releases are marked **Pre-release** and **not Latest**."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::endgroup::"


# ==================================================================
# DOWNLOAD CCACHE ONCE
# ==================================================================

  prepare_ccache:

    name: Prepare ccache binary (download once)

    needs:
      - set-op-model
      - prepare_cache_releases

    runs-on: ubuntu-latest

    steps:

      - name: Download custom ccache once
        run: |

          set -uo pipefail

          echo "::group::Download ccache"

          url="https://raw.githubusercontent.com/WildKernels/kernel_patches/refs/heads/main/ccache/ccache-x86-64"

          ok=0

          for attempt in 1 2 3 4 5 6; do

            if curl \
              -LfsS \
              --connect-timeout 30 \
              --max-time 120 \
              -H "User-Agent: Mozilla/5.0" \
              "$url" \
              -o ccache \
              &&
              [ -s ccache ]; then

              ok=1
              break

            fi

            echo "attempt $attempt failed (GitHub raw 504/throttle); backing off..."

            sleep $(( attempt * 5 + RANDOM % 6 ))

          done

          if [ "$ok" = 1 ]; then

            echo "✅ downloaded ccache once for all matrix jobs"

          else

            echo "::warning::custom ccache download failed; matrix jobs will fall back to the apt ccache"

            rm -f ccache

          fi

          echo "::endgroup::"


      - name: Upload ccache artifact
        uses: actions/upload-artifact@v7
        with:
          name: ccache-binary
          path: ccache
          retention-days: 1
          if-no-files-found: warn


# ==================================================================
# BUILD
# ==================================================================

  build:

    name: build (${{ matrix.model }}, ${{ matrix.soc }}, ${{ matrix.branch }}, ${{ matrix.manifest }}, ${{ matrix.android_version }}, ${{ matrix.kernel_version }}, ${{ matrix.os_version }}, ${{ matrix.ksu_type }})

    needs:
      - set-op-model
      - mirror_toolchain
      - prepare_cache_releases
      - prepare_ccache

    if: |
      !cancelled() &&
      needs.set-op-model.result == 'success' &&
      needs.prepare_cache_releases.result == 'success' &&
      needs.prepare_ccache.result == 'success' &&
      (
        needs.mirror_toolchain.result == 'success' ||
        needs.mirror_toolchain.result == 'skipped'
      )

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix: ${{ fromJSON(needs.set-op-model.outputs.matrix) }}

    outputs:
      ksun_ver: ${{ steps.build-stat.outputs.ksu_version }}
      ksu_ver: ${{ steps.build-stat.outputs.ksu_version }}

    steps:

      # ------------------------------------------------------------
      # HARD OP15 CHECK
      # ------------------------------------------------------------

      - name: 🛡️ Verify OP15-only build
        shell: bash
        run: |

          set -euo pipefail

          echo "Matrix model: ${{ matrix.model }}"

          if [ "${{ matrix.model }}" != "OP15" ]; then

            echo "::error::Build blocked: only OP15 is allowed."

            exit 1

          fi

          echo "✅ OP15 verified."


      # ------------------------------------------------------------
      # Checkout
      # ------------------------------------------------------------

      - name: 📥 Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1


      # ------------------------------------------------------------
      # Disk cleanup
      # ------------------------------------------------------------

      - name: 🧹 Emergency Disk Cleanup
        if: ${{ matrix.disk_cleanup }}
        uses: ./.github/actions/disk-cleanup


      # ------------------------------------------------------------
      # Dependencies
      # ------------------------------------------------------------

      - name: Install Minimal Dependencies
        run: |

          set -euo pipefail

          echo "::group::Install dependencies"

          sudo apt-get \
            -o Acquire::Retries=3 \
            update \
            -qq

          sudo DEBIAN_FRONTEND=noninteractive apt-get install \
            -y \
            --no-install-recommends \
            git \
            curl \
            ca-certificates \
            build-essential \
            clang \
            lld \
            flex \
            bison \
            libelf-dev \
            libssl-dev \
            libncurses-dev \
            zlib1g-dev \
            liblz4-tool \
            libxml2-utils \
            rsync \
            unzip \
            dwarves \
            file \
            python3 \
            ccache \
            jq \
            bc \
            dos2unix \
            kmod \
            libdw-dev \
            elfutils \
            pigz

          sudo apt-get clean

          echo "✅ Dependencies installed"

          echo "::endgroup::"


      # ------------------------------------------------------------
      # Download ccache binary
      # ------------------------------------------------------------

      - name: Get prebuilt ccache
        uses: actions/download-artifact@v8
        with:
          name: ccache-binary
          path: ccache-dl

        continue-on-error: true


      # ------------------------------------------------------------
      # Install ccache
      # ------------------------------------------------------------

      - name: Install ccache
        run: |

          set -uo pipefail

          echo "::group::Install ccache"

          if [ -s ccache-dl/ccache ]; then

            sudo cp -f \
              ccache-dl/ccache \
              /usr/bin/ccache

            sudo chmod +x \
              /usr/bin/ccache

            echo "✅ installed custom ccache from shared artifact"

          else

            echo "::warning::shared ccache artifact unavailable; using apt ccache"

          fi

          rm -rf ccache-dl

          echo "[DEBUG] Ccache version:"

          ccache --version | head -1

          echo "::endgroup::"


      # ------------------------------------------------------------
      # Configure ccache and LTO cache
      # ------------------------------------------------------------

      - name: ♻️ Configure ccache & LTO cache (bounded)
        run: |

          echo "::group::Configure ccache environment"

          set -euo pipefail

          if command -v ccache >/dev/null 2>&1; then

            CACHE_DIR="${{ github.workspace }}/.ccache"

            LDCACHE_DIR="${{ github.workspace }}/.ld_cache"

            CCACHE_LOG="${{ github.workspace }}/ccache.log"

            mkdir -p "$CACHE_DIR"
            mkdir -p "$LDCACHE_DIR"

            SETTINGS=(

              "CCACHE_DIR=$CACHE_DIR"

              "LDCACHE_DIR=$LDCACHE_DIR"

              "CCACHE_MAXSIZE=12G"

              "CCACHE_COMPILERCHECK=content"

              "CCACHE_BASEDIR=${GITHUB_WORKSPACE}"

              "CCACHE_NOHASHDIR=true"

              "CCACHE_IGNOREOPTIONS=--sysroot*"

              "CCACHE_COMPRESSION=true"

              "CCACHE_COMPRESSION_LEVEL=3"

              "CCACHE_DIRECT=true"

              "CCACHE_FILE_CLONE=true"

              "CCACHE_INODE_CACHE=true"

              "CCACHE_IS_KERNEL_COMPILING=true"

              "CCACHE_UMASK=002"

              "CCACHE_SLOPPINESS=file_macro,time_macros,include_file_mtime,include_file_ctime,pch_defines,system_headers,locale"

            )

            for setting in "${SETTINGS[@]}"; do

              export "$setting"

              echo "$setting" >> "$GITHUB_ENV"

            done

            if [ "${{ inputs.debug }}" == "true" ]; then

              export "CCACHE_LOGFILE=$CCACHE_LOG"

              echo "CCACHE_LOGFILE=$CCACHE_LOG" >> "$GITHUB_ENV"

            fi

            if ccache --help 2>&1 | grep -q 'depend_mode'; then

              export CCACHE_DEPEND=true

              echo "CCACHE_DEPEND=true" >> "$GITHUB_ENV"

            fi

            echo "✅ ccache configured successfully"

            echo ""

            echo "Current ccache configuration:"

            ccache -p

          else

            echo "ccache not found, skipping configuration."

          fi

          echo "::endgroup::"


      # ------------------------------------------------------------
      # Remove KSU-specific fields from config
      # ------------------------------------------------------------

      - name: 🧹 Prepare op_config_json
        id: prepare_config
        shell: bash
        run: |

          echo "config_json=$(

            jq -nc \
              --argjson m '${{ toJSON(matrix) }}' \
              '$m | del(.ksu_type, .ksu_hash, .ksu_resolved_hash)'

          )" >> "$GITHUB_OUTPUT"


      # ------------------------------------------------------------
      # Build OP15
      # ------------------------------------------------------------

      - name: 🔨 Build OP15 Kernel
        id: build
        uses: ./.github/actions/build-kernel

        with:

          op_config_json: ${{ steps.prepare_config.outputs.config_json }}

          ksu_type: ${{ matrix.ksu_type }}

          ksu_branch_or_hash: ${{ matrix.ksu_resolved_hash }}

          susfs_commit_hash_or_branch: ${{ matrix.susfs_resolved_hash }}

          optimize_level: ${{ inputs.optimize_level }}

          build_timestamp: ${{ inputs.build_timestamp }}

          clean: ${{ inputs.clean_build }}

          debug: ${{ inputs.debug }}

          github_token: ${{ secrets.GITHUB_TOKEN }}


      # ============================================================
      # NEW: FIND OP15 ANYKERNEL3 ZIP
      # ============================================================

      - name: 🔎 Find OP15 AnyKernel3 ZIP
        id: find-ak3
        if: ${{ steps.build.outcome == 'success' }}
        shell: bash
        run: |

          set -euo pipefail

          echo "::group::Searching for OP15 AnyKernel3 ZIP"

          AK3_DIR="${RUNNER_TEMP}/op15-ak3"

          rm -rf "$AK3_DIR"

          mkdir -p "$AK3_DIR"

          echo "Searching workspace for:"
          echo "  AK3_OP15*.zip"

          echo ""

          mapfile -t AK3_FILES < <(
            find "$GITHUB_WORKSPACE" \
              -type f \
              -name 'AK3_OP15*.zip' \
              -print
          )

          if [ "${#AK3_FILES[@]}" -eq 0 ]; then

            echo "::error::No AK3_OP15*.zip was found after the kernel build."

            echo ""

            echo "Files containing 'AK3' found in workspace:"

            find "$GITHUB_WORKSPACE" \
              -type f \
              \( -iname '*AK3*' -o -iname '*AnyKernel*' \) \
              -print \
              | head -100 \
              || true

            echo ""

            echo "Top-level ZIP files:"

            find "$GITHUB_WORKSPACE" \
              -type f \
              -name '*.zip' \
              -print \
              | head -100 \
              || true

            exit 1

          fi

          echo "Found ${#AK3_FILES[@]} OP15 AK3 ZIP(s):"

          for file in "${AK3_FILES[@]}"; do

            echo "  ✅ $file"

          done

          echo ""

          # ----------------------------------------------------------
          # Copy only the OP15 AK3 ZIP(s) to a clean directory.
          # ----------------------------------------------------------

          for file in "${AK3_FILES[@]}"; do

            cp -f \
              "$file" \
              "$AK3_DIR/"

          done

          echo "Artifact contents:"

          ls -lah "$AK3_DIR"

          echo ""

          echo "ak3_dir=$AK3_DIR" >> "$GITHUB_OUTPUT"

          echo "::endgroup::"


      # ============================================================
      # NEW: UPLOAD AK3 ZIP AS GITHUB ACTIONS ARTIFACT
      # ============================================================

      - name: 📦 Upload OP15 AnyKernel3 ZIP
        if: ${{ steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:

          name: AK3-OP15-${{ matrix.os_version }}-${{ matrix.android_version }}-${{ matrix.kernel_version }}-${{ matrix.ksu_type }}

          path: ${{ steps.find-ak3.outputs.ak3_dir }}/*.zip

          if-no-files-found: error

          retention-days: 7


      # ------------------------------------------------------------
      # Statistics
      # ------------------------------------------------------------

      - name: 📊 Build statistics
        id: build-stat
        if: always()
        run: |

          echo "::group::Build Statistics"

          echo "Device: ${{ matrix.model }}"

          echo "OS Version: ${{ matrix.os_version }}"

          echo "Kernel: ${{ matrix.android_version }}-${{ matrix.kernel_version }}"

          if [ "${{ matrix.susfs }}" = true ]; then

            echo "SUSFS Hash: ${{ matrix.susfs_resolved_hash }}"

          fi

          echo "Status: ${{ job.status }}"

          if [ "${{ steps.build.outcome }}" = "success" ]; then

            echo ""

            echo "✅ OP15 build completed successfully"

            echo ""

            echo "Outputs:"

            echo "  - Kernel: ${{ steps.build.outputs.kernel_version }}"

            if [ "${{ matrix.ksu_type }}" = "KSUN" ]; then

              echo "  - KSU Next: v${{ steps.build.outputs.ksu_version }}"

              echo "ksun_ver=${{ steps.build.outputs.ksu_version }}" \
                >> "$GITHUB_OUTPUT"

              echo "ksu_ver=" >> "$GITHUB_OUTPUT"

            else

              echo "  - KSU: v${{ steps.build.outputs.ksu_version }}"

              echo "ksun_ver=" >> "$GITHUB_OUTPUT"

              echo "ksu_ver=${{ steps.build.outputs.ksu_version }}" \
                >> "$GITHUB_OUTPUT"

            fi

            if [ "${{ matrix.susfs }}" = true ]; then

              echo "  - SUSFS: ${{ steps.build.outputs.susfs_version }}"

            fi

            echo "  - Build time: ${{ steps.build.outputs.build_time }}s"

            if [ "${{ inputs.clean_build }}" != "true" ]; then

              echo "  - ccache hit rate: ${{ steps.build.outputs.ccache_hit_rate }}"

              echo "  - ccache direct rate: ${{ steps.build.outputs.ccache_direct_rate }}"

            else

              echo "  - ccache: disabled (clean build)"

            fi

            if [ -n "${{ steps.build.outputs.warnings }}" ]; then

              echo "  - Warnings: ${{ steps.build.outputs.warnings }}"

            fi

          else

            echo "❌ Build failed"

          fi

          echo "::endgroup::"


      # ------------------------------------------------------------
      # Job summary
      # ------------------------------------------------------------

      - name: 📝 Job summary
        if: always()
        run: |

          cat >> "$GITHUB_STEP_SUMMARY" << EOF

          ### OP15 (${{ matrix.os_version }}) - ${{ job.status == 'success' && '✅ Success' || '❌ Failed' }}

          **Model:** OP15

          **Kernel:** ${{ matrix.android_version }}-${{ matrix.kernel_version }}

          EOF

          if [ "${{ matrix.susfs }}" = true ]; then

            cat >> "$GITHUB_STEP_SUMMARY" << EOF

          **SUSFS Hash:** \`${{ matrix.susfs_resolved_hash }}\`

          EOF

          fi

          if [ "${{ steps.build.outcome }}" = "success" ]; then

            cat >> "$GITHUB_STEP_SUMMARY" << EOF

          | Metric | Value |
          |--------|-------|
          | **Kernel** | ${{ steps.build.outputs.kernel_version }} |
          EOF

            if [ "${{ matrix.ksu_type }}" = "KSUN" ]; then

              cat >> "$GITHUB_STEP_SUMMARY" << EOF

          | **KSU Next** | v${{ steps.build.outputs.ksu_version }} |
          EOF

            else

              cat >> "$GITHUB_STEP_SUMMARY" << EOF

          | **KSU** | v${{ steps.build.outputs.ksu_version }} |
          EOF

            fi

            if [ "${{ matrix.susfs }}" = true ]; then

              cat >> "$GITHUB_STEP_SUMMARY" << EOF

          | **SUSFS** | ${{ steps.build.outputs.susfs_version }} |
          EOF

            fi

            cat >> "$GITHUB_STEP_SUMMARY" << EOF

          | **Build Time** | ${{ steps.build.outputs.build_time }}s |
          EOF

            if [ "${{ inputs.clean_build }}" != "true" ]; then

              cat >> "$GITHUB_STEP_SUMMARY" << EOF

          | **ccache Hit Rate** | ${{ steps.build.outputs.ccache_hit_rate }} |
          | **ccache Direct Rate** | ${{ steps.build.outputs.ccache_direct_rate }} |
          EOF

            fi

            if [ -n "${{ steps.build.outputs.warnings }}" ]; then

              echo "| **Warnings** | ${{ steps.build.outputs.warnings }} |" \
                >> "$GITHUB_STEP_SUMMARY"

            fi

            cat >> "$GITHUB_STEP_SUMMARY" << EOF

          **Image SHA256:** \`${{ steps.build.outputs.image_sha256 }}\`

          **AnyKernel3 Zip SHA256:** \`${{ steps.build.outputs.zip_sha256 }}\`

          EOF

          fi


      # ============================================================
      # NEW: AK3 DOWNLOAD INFORMATION
      # ============================================================

      - name: 📥 AK3 artifact summary
        if: ${{ steps.build.outcome == 'success' }}
        shell: bash
        run: |

          cat >> "$GITHUB_STEP_SUMMARY" << EOF

          ---

          ## 📦 OP15 AnyKernel3 Download

          The OP15 AnyKernel3 kernel ZIP has been uploaded as a GitHub Actions artifact.

          **Artifact:**

          \`AK3-OP15-${{ matrix.os_version }}-${{ matrix.android_version }}-${{ matrix.kernel_version }}-${{ matrix.ksu_type }}\`

          Go to the **Artifacts** section of this workflow run to download the kernel ZIP.

          **Target:** OP15 only.

          EOF


      # ------------------------------------------------------------
      # Cleanup
      # ------------------------------------------------------------

      - name: 🧹 Final cleanup and space report
        if: always()
        run: |

          echo "::group::Cleanup"

          sudo rm -rf \
            "$GITHUB_WORKSPACE/out" \
            "$GITHUB_WORKSPACE/build" \
            "$GITHUB_WORKSPACE/kernel/out" \
            "$GITHUB_WORKSPACE/.repo" \
            /tmp/* \
            || true

          if command -v ccache >/dev/null 2>&1; then

            echo ""

            echo "📊 ccache statistics after build:"

            ccache -s

            echo ""

            echo "💾 ccache preserved for cache upload"

          fi

          echo ""

          echo "💽 Final disk usage:"

          df -h /

          echo "::endgroup::"


# ==================================================================
# CREATE PRODUCTION/TEST RELEASE
# ==================================================================

  trigger-release:

    needs:
      - set-op-model
      - build

    runs-on: ubuntu-latest

    if: |
      !cancelled() &&
      inputs.make_release == true &&
      needs.build.result == 'success' &&
      needs.set-op-model.result == 'success'

    env:

      REPO_OWNER: ${{ github.repository_owner }}

      REPO_NAME: ${{ github.event.repository.name }}

      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      SUSFS_BASE_VERSION: ${{ needs.set-op-model.outputs.susfs_base_version }}

      RELEASE_NAME: '*TEST BUILD* OnePlus 15 Kernel With KernelSU Next & SUSFS ${{ needs.set-op-model.outputs.susfs_base_version }} *TEST BUILD*'


    steps:

      # ------------------------------------------------------------
      # Checkout
      # ------------------------------------------------------------

      - name: 📥 Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0


      # ------------------------------------------------------------
      # Verify release is OP15 only
      # ------------------------------------------------------------

      - name: 🛡️ Verify release contains OP15 only
        run: |

          set -euo pipefail

          if [ "${{ inputs.op_model }}" != "OP15" ]; then

            echo "::error::Release blocked: only OP15 is supported."

            exit 1

          fi

          echo "✅ Release target verified: OP15"


      # ------------------------------------------------------------
      # Generate tag
      # ------------------------------------------------------------

      - name: 🏷️ Generate and Create New Tag
        run: |

          set -euo pipefail

          LATEST_MATCHING_TAG=$(
            gh api "repos/$REPO_OWNER/$REPO_NAME/tags" \
              --jq "
                [
                  .[]
                  |
                  select(
                    .name
                    |
                    startswith(\"${SUSFS_BASE_VERSION}-r\")
                  )
                ]
                |
                sort_by(
                  .name
                  |
                  split(\"-r\")[1]
                  |
                  tonumber
                )
                |
                last
                |
                .name // empty
              "
          )

          if [ -z "$LATEST_MATCHING_TAG" ]; then

            NEW_TAG="${SUSFS_BASE_VERSION}-r1"

          else

            NEW_TAG=$(
              echo "$LATEST_MATCHING_TAG"
              |
              awk -F'-r' '{
                printf "%s-r%d", $1, $2+1
              }'
            )

          fi

          echo "New tag: $NEW_TAG"

          echo "NEW_TAG=${NEW_TAG}" >> "$GITHUB_ENV"

          git tag "$NEW_TAG"

          git push origin "$NEW_TAG"


      # ------------------------------------------------------------
      # Download artifacts
      # ------------------------------------------------------------

      - name: 📥 Download Artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./downloaded-artifacts
          merge-multiple: true
          skip-decompress: true


      # ------------------------------------------------------------
      # Generate release notes
      # ------------------------------------------------------------

      - name: 📝 Generate Device List and Final Release Notes
        id: generate-notes
        run: |

          set -euo pipefail

          echo "=== Start building OP15 release notes ==="

          # --------------------------------------------------------
          # Remove ccache binary artifact
          # --------------------------------------------------------

          rm -f \
            ./downloaded-artifacts/ccache-binary.zip \
            || true

          # --------------------------------------------------------
          # Collect build metadata
          # --------------------------------------------------------

          declare -A device_info

          JSON_BUILD_DATA=$(
            jq -c '.' \
              ./downloaded-artifacts/matrix.json
          )

          for file in \
            $(find downloaded-artifacts \
              -maxdepth 1 \
              -name "*.zip" \
              -type f \
              | sort); do

            [ -f "$file" ] || continue

            zipname=$(basename "$file" .zip)

            rest="${zipname#AK3_}"

            IFS='_' read -ra parts <<< "$rest"

            model="${parts[0]}"

            os_version="${parts[1]}"

            kernel_version="${parts[2]}"

            ksu_type="${parts[3]}"

            ksu_ver="${parts[4]}"

            if [ "${parts[5]:-}" = "SuSFS" ]; then

              susfs_ver="${parts[6]:-unknown}"

            else

              susfs_ver="none"

            fi

            # ----------------------------------------------------
            # HARD OP15 CHECK
            # ----------------------------------------------------

            if [ "$model" != "OP15" ]; then

              echo "::error::Non-OP15 artifact found: $model"

              exit 1

            fi

            full_model="${model}_${os_version}_${kernel_version}"

            device_info["$full_model"]="$model|$os_version|$kernel_version|$ksu_type|$ksu_ver|$susfs_ver|$zipname"

          done

          ksu_type="${{ fromJSON(needs.set-op-model.outputs.ksu_options_normalized)[0].type }}"

          ksu_ref="${{ fromJSON(needs.set-op-model.outputs.ksu_options_normalized)[0].hash }}"

          ksu_resolved_hash="${{ needs.set-op-model.outputs.ksu_resolved_hash }}"

          OPTIMIZE_LEVEL="${{ inputs.optimize_level }}"

          CLEAN_BUILD="${{ inputs.clean_build }}"

          declare -A susfs_map=(

            ["android12-5.10"]="${{ needs.set-op-model.outputs.susfs_hash_android12_5_10 }}"

            ["android13-5.15"]="${{ needs.set-op-model.outputs.susfs_hash_android13_5_15 }}"

            ["android14-6.1"]="${{ needs.set-op-model.outputs.susfs_hash_android14_6_1 }}"

            ["android15-6.6"]="${{ needs.set-op-model.outputs.susfs_hash_android15_6_6 }}"

            ["android16-6.12"]="${{ needs.set-op-model.outputs.susfs_hash_android16_6_12 }}"

          )

          IFS=',' read -ra active_gki_keys \
            <<< "${{ needs.set-op-model.outputs.active_gki_keys }}"

          # --------------------------------------------------------
          # Release notes header
          # --------------------------------------------------------

          cat << EOF > release_notes.md

          # 🎯 OnePlus 15 Kernel with KernelSU Next & SUSFS $SUSFS_BASE_VERSION

          > **Target Device:** OP15  
          > **Build Date:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')  
          > **Build ID:** \`${{ github.run_id }}\`  
          > **Workflow:** [\`${{ github.workflow }}\`](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

          ---

          ## 📦 Built Devices (${#device_info[@]} total)

          | Model | OS Version | Kernel Version | Features |
          |-------|------------|----------------|----------|
          EOF

          while IFS= read -r full_key; do

            [ -z "$full_key" ] && continue

            IFS='|' read -r \
              model \
              os_ver \
              kernel_ver \
              _ \
              _ \
              _ \
              zipfile \
              <<< "${device_info["$full_key"]}"

            full_kv=$(
              echo "$kernel_ver"
              |
              sed 's/^[^-]*-//'
            )

            possible_orig_model="${model}-${full_kv}"

            feature_flags=$(
              jq -r \
                --arg MODEL "$model" \
                --arg ORIG_MODEL "$possible_orig_model" \
                --arg OS "$os_ver" '
                (
                  [
                    .[]
                    |
                    select(
                      .model == $ORIG_MODEL
                      and
                      .os_version == $OS
                    )
                  ][0]
                )
                //
                (
                  [
                    .[]
                    |
                    select(
                      .model == $MODEL
                      and
                      .os_version == $OS
                    )
                  ][0]
                )
                |
                "\(.hmbird // false)\t\(.susfs // false)\t\(.bbr // false)\t\(.bbr3 // false)\t\(.bbg // false)\t\(.ttl // false)\t\(.ip_set // false)\t\(.unicode // false)\t\(.ds // false)\t\(.ntsync // false)"
              ' <<< "$JSON_BUILD_DATA"
            )

            features=()

            if [[ -z "$feature_flags" ]]; then

              echo "Warning: No JSON entry found for model: $model" >&2

              features_str="N/A"

            else

              IFS=$'\t' read -r \
                hmbird \
                susfs \
                bbr \
                bbr3 \
                bbg \
                ttl \
                ip_set \
                unicode \
                ds \
                ntsync \
                <<< "$feature_flags"

              [[ "$hmbird" == "true" ]] && features+=("🐦 HMBIRD")

              [[ "$susfs" == "true" ]] && features+=("ඞ SusFS")

              [[ "$bbr" == "true" ]] && features+=("🚀 BBR")

              [[ "$bbr3" == "true" ]] && features+=("🚀 BBRv3")

              [[ "$bbg" == "true" ]] && features+=("🛡️ BBG")

              [[ "$ttl" == "true" ]] && features+=("🌐 TTL")

              [[ "$ip_set" == "true" ]] && features+=("🧱 IP_SET & IPv6 NAT")

              [[ "$unicode" == "true" ]] && features+=("🔧 Unicode Fix")

              [[ "$ds" == "true" ]] && features+=("💻 Droidspaces")

              [[ "$ntsync" == "true" ]] && features+=("🔃 NTSync")

              total=${#features[@]}

              if [ "$total" -eq 0 ]; then

                features_str="N/A"

              else

                features_str=""

                count=0

                for item in "${features[@]}"; do

                  count=$((count + 1))

                  features_str+="$item"

                  if [ "$count" -lt "$total" ]; then

                    if [ $((count % 3)) -eq 0 ]; then

                      features_str+="<br>"

                    else

                      features_str+="   "

                    fi

                  fi

                done

              fi

            fi

            if [[ "$os_ver" =~ ^A[0-9]+$ ]]; then

              os_display_version="Android ${os_ver#A}"

            else

              os_display_version="$os_ver"

            fi

            download_url="https://github.com/${REPO_OWNER}/${REPO_NAME}/releases/download/${NEW_TAG}/${zipfile}.zip"

            model_link="[$model]($download_url)"

            printf \
              "| %s | %-10s | %-16s | %-48s |\n" \
              "$model_link" \
              "$os_display_version" \
              "$kernel_ver" \
              "$features_str" \
              >> release_notes.md

          done < <(

            printf '%s\n' \
              "${!device_info[@]}" |
              sort

          )

          if [ ${#device_info[@]} -eq 0 ]; then

            echo "::error::No OP15 device info found!"

            exit 1

          fi

          first_entry=$(
            printf '%s\n' \
              "${!device_info[@]}" |
              sort |
              head -n1
          )

          IFS='|' read -r \
            _ \
            _ \
            _ \
            _ \
            ksu_ver_global \
            _ \
            _ \
            <<< "${device_info["$first_entry"]}"

          # --------------------------------------------------------
          # Build configuration
          # --------------------------------------------------------

          cat << EOF >> release_notes.md

          ---

          ## 🔧 Build Configuration

          | Component | Version/Setting |
          |-----------|----------------|
          EOF

          ksu_display_value() {

            local input="$1"
            local resolved="$2"

            if [[ "$input" =~ ^[0-9a-f]{40}$ ]]; then

              echo "$input"

            else

              echo "$input ($resolved)"

            fi

          }

          ksu_display=$(
            ksu_display_value \
              "$ksu_ref" \
              "$ksu_resolved_hash"
          )

          if [ "$ksu_type" == "KSUN" ]; then

            cat << EOF >> release_notes.md

          | **KernelSU Next Branch** | \`$ksu_display\` |
          | **KernelSU Next Version** | \`$ksu_ver_global\` |
          EOF

          elif [ "$ksu_type" == "KSU" ]; then

            cat << EOF >> release_notes.md

          | **KernelSU Branch** | \`$ksu_display\` |
          | **KernelSU Version** | \`$ksu_ver_global\` |
          EOF

          fi

          cat << EOF >> release_notes.md

          | **Target Device** | \`OP15\` |
          | **SUSFS Version** | \`$SUSFS_BASE_VERSION\` |
          | **Optimization Level** | \`$OPTIMIZE_LEVEL\` |
          | **Clean Build** | $( [ "$CLEAN_BUILD" = "true" ] && echo "✅ Yes (no ccache)" || echo "❌ No (ccache enabled)" ) |
          | **Compiler** | Clang (version varies by device) |

          ### 📌 SUSFS Branch Mapping

          | Kernel Version | SUSFS Commit |
          |----------------|--------------|
          EOF

          for key in "${active_gki_keys[@]}"; do

            [ -z "$key" ] && continue

            echo "| $key | \`${susfs_map[$key]:-unknown}\` |" \
              >> release_notes.md

          done

          cat << EOF >> release_notes.md

          ---

          ## ✨ Features & Capabilities

          ### 🔐 Root Management

          EOF

          if [ "$ksu_type" == "KSUN" ]; then

            cat << EOF >> release_notes.md

          - **KernelSU Next** - Next-generation kernel-level root solution

          EOF

          elif [ "$ksu_type" == "KSU" ]; then

            cat << EOF >> release_notes.md

          - **KernelSU** - Kernel-level root solution

          EOF

          fi

          cat << EOF >> release_notes.md

          - **SUSFS $SUSFS_BASE_VERSION** - Advanced hiding and security features

          ### 🛡️ Security & Privacy

          - **Baseband Guard (BBG)** - LSM-based baseband security
          - **SUSFS Hide Features**
          - **SUS_PATH**
          - **SUS_MOUNT**
          - **SUS_KSTAT**
          - **SPOOF_UNAME**
          - **SPOOF_CMDLINE**
          - **OPEN_REDIRECT**
          - **SUS_MAP**
          - **AVC_SPOOF**
          - **Ptrace Leak Fix**
          - **Unicode Fix**

          ### 🚀 Performance & Networking

          - **BBRv1**
          - **BBRv3**
          - **CAKE and PIE**
          - **Wireguard**
          - **IP Set & IPv6 NAT**
          - **TTL Target Support**
          - **LTO**
          - **ccache-accelerated builds**
          - **Compiler optimisations**

          ### 🔧 System Features

          - **TMPFS_XATTR**
          - **TMPFS_POSIX_ACL**
          - **HMBIRD SCX**
          - **Droidspaces**
          - **NTSync**

          ---

          ## 📱 Manager Applications

          EOF

          if [ "$ksu_type" == "KSUN" ]; then

            cat << EOF >> release_notes.md

          ### KernelSU Next Manager

          → https://github.com/KernelSU-Next/KernelSU-Next/releases

          EOF

          elif [ "$ksu_type" == "KSU" ]; then

            cat << EOF >> release_notes.md

          ### KernelSU Manager

          → https://github.com/tiann/KernelSU/releases

          EOF

          fi

          cat << EOF >> release_notes.md

          ### Community Managers

          - WildKSU Manager

          ### Required Module

          - KSU SUSFS Module

          ### Recommended Flasher

          - Kernel Flasher

          ---

          ## 📥 Installation Instructions

          ### Prerequisites

          - Unlocked bootloader.
          - Backup your current boot image.
          - Have root access using Magisk / KernelSU / APatch.

          ### Via Kernel Flasher

          1. Download the correct **OP15** AnyKernel3 ZIP.
          2. Backup your current boot image.
          3. Flash the ZIP to the active slot.
          4. Install the matching KernelSU Next Manager.
          5. Open the manager.
          6. Reboot if required.

          ---

          ## 📜 Changelog

          ### This Release

          - Updated SUSFS to $SUSFS_BASE_VERSION.
          - OP15-only build.
          - Improved ccache build system.
          - Enhanced SUSFS hiding capabilities.
          - Added IP_SET, IPv6 NAT and TTL support.
          - Added TMPFS_XATTR and TMPFS_POSIX_ACL.
          - Added Ptrace leak fix.
          - Compiler optimizations ($OPTIMIZE_LEVEL).
          - Additional general optimisations.
          - Wild_KSU Manager Support.
          - Unicode Bypass Fix.
          - Droidspaces Support.
          - NTSync Support.

          ---

          **Target device: OP15 only.**

          **⚡ Built with ❤️ by the community**

          EOF

          echo "--- Final Release Notes ---"

          cat release_notes.md


      # ------------------------------------------------------------
      # Create production/test release
      # ------------------------------------------------------------

      - name: 🚀 Create GitHub Release
        run: |

          gh release create "${{ env.NEW_TAG }}" \
            --repo "${{ env.REPO_OWNER }}/${{ env.REPO_NAME }}" \
            --title "${{ env.RELEASE_NAME }}" \
            --notes-file release_notes.md \
            --draft


      # ------------------------------------------------------------
      # Upload kernel ZIPs
      # ------------------------------------------------------------

      - name: 📤 Upload OP15 Release Assets
        run: |

          set -euo pipefail

          for file in ./downloaded-artifacts/*.zip; do

            if [ -f "$file" ]; then

              basename_file=$(basename "$file")

              # Never upload ccache artifact
              if [ "$basename_file" = "ccache-binary.zip" ]; then
                continue
              fi

              echo "Checking asset: $basename_file"

              # Only OP15 assets are allowed.
              if [[ "$basename_file" != AK3_OP15* ]]; then

                echo "::error::Blocked non-OP15 release asset: $basename_file"

                exit 1

              fi

              echo "Uploading OP15 asset: $file"

              gh release upload \
                "${{ env.NEW_TAG }}" \
                "$file" \
                --clobber \
                --repo "${{ env.REPO_OWNER }}/${{ env.REPO_NAME }}"

            fi

          done


      # ------------------------------------------------------------
      # Release summary
      # ------------------------------------------------------------

      - name: 📊 Release summary
        if: success()
        run: |

          cat >> "$GITHUB_STEP_SUMMARY" << EOF

          ---

          ## 🎉 OP15 Release Created Successfully

          **Target:** OP15 only

          **Tag:** [\`${{ env.NEW_TAG }}\`](${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ env.NEW_TAG }})

          **Kernels:** $(

            find ./downloaded-artifacts \
              -maxdepth 1 \
              -name "AK3_OP15*.zip" \
              -type f |
              wc -l

          )

          ### 📦 Assets

          EOF

          for zip in ./downloaded-artifacts/AK3_OP15*.zip; do

            if [ -f "$zip" ]; then

              name=$(basename "$zip")

              size=$(stat -c%s "$zip")

              size_mb=$(
                echo "scale=2; $size / 1024 / 1024" |
                bc
              )

              echo "- \`$name\` (${size_mb} MB)" \
                >> "$GITHUB_STEP_SUMMARY"

            fi

          done

          cat >> "$GITHUB_STEP_SUMMARY" << EOF

          ---

          ### 💾 Persistent Build Cache

          - \`ccache-cache\` — Pre-release / not Latest
          - \`lto-cache\` — Pre-release / not Latest

          ### 📦 Actions Artifact

          The OP15 AnyKernel3 ZIP is also available from the workflow run's **Artifacts** section.

          EOF
